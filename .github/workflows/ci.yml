name: Skill integrity and regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install Pillow
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check manifest hashes
        run: python scripts/verify_manifest.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Browser fixture E2E
        run: python -m unittest discover -s tests -p 'test_*e2e.py' -v

  jsx-ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-save --no-package-lock typescript@5.9.3
      - name: JSX AST regression
        run: python -m unittest discover -s tests -p test_regressions_v2.py -v

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TypeScript parser
        run: npm install --no-save --no-package-lock typescript@5.9.3
      - name: Benchmark detector regression tests
        run: ANTI_AI_SLOP_RUN_AST_BENCHMARK=1 python -m unittest discover -s tests -p test_benchmark_v2.py -v
      - name: Five-stack development and holdout benchmark
        run: python scripts/run_benchmark.py --min-precision 0.90 --min-recall 0.85 --out reports/benchmark-stacks.json
      - name: Five product scenario benchmark
        run: python scripts/run_scenario_benchmark.py --out reports/benchmark-scenarios.json
      - name: High-confidence accessibility detectors (positive and negative examples)
        run: python scripts/run_accessibility_benchmark.py --min-precision 0.95 --min-recall 0.90 --out reports/benchmark-accessibility.json
      - name: Measure degraded fallback without TypeScript AST
        run: python scripts/run_accessibility_benchmark.py --no-ast --min-recall 0.75 --out reports/benchmark-accessibility-fallback.json
      - name: Five-stack structural repair, rollback and preservation
        run: python scripts/run_structural_benchmark.py --out reports/benchmark-structural.json
      - name: Benchmark regression contract tests
        run: python -m unittest tests.test_quality_benchmarks_v2 -v
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark-reports
          path: reports/benchmark-*.json

  quality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright Pillow
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Structural, axe-core, visual and Lighthouse integration
        run: python -m unittest tests.test_structural_fix tests.test_visual_compare tests.test_visual_e2e tests.test_quality_tools tests.test_lighthouse_e2e -v
      - name: Real Chromium click navigation after structural repair (3 viewports)
        run: python scripts/run_structural_benchmark.py --browser --out reports/structural-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-audit-results
          path: reports/
          if-no-files-found: ignore

  agent-compatibility:
    name: Agent Skill compatibility (${{ matrix.agent }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, claude, cursor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate installed skills without authenticated agent execution
        run: python scripts/agent_compat.py --agent "${{ matrix.agent }}" --out "reports/agent-${{ matrix.agent }}.json"
      - name: Summarize and flag unverified runtime
        if: always()
        run: |
          python scripts/ci_summary.py "reports/agent-${{ matrix.agent }}.json" --out "reports/agent-${{ matrix.agent }}-summary.md"
          cat "reports/agent-${{ matrix.agent }}-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-compat-${{ matrix.agent }}
          path: reports/agent-${{ matrix.agent }}*.json
          if-no-files-found: error
          retention-days: 30

  gate-contract:
    name: Evidence gate negative tests and signed outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gate contract regression tests and preserve logs
        run: python scripts/ci_evidence.py --kind gate_contract --out reports/gate -- python -m unittest tests.test_gate tests.test_gate_hardening tests.test_ci_evidence -v
      - name: Gate MUST reject unproved 9.5 claims
        run: |
          if python scripts/evaluate_gate.py templates/GATE_INPUT.example.json --out reports/gate/unapproved-example.json; then
            echo "ERROR: gate approved an unverified claim" >&2
            exit 1
          fi
          echo 'Gate correctly rejected an unverified claim' > reports/gate/negative-gate.txt
      - name: Add truthful CI summary
        if: always()
        run: |
          python scripts/ci_summary.py reports/gate/gate_contract.json --out reports/gate/SUMMARY.md
          cat reports/gate/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish negative tests, logs and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-contract-evidence
          path: reports/gate/
          if-no-files-found: error
          retention-days: 30

  attested-ci-evidence:
    name: Signed CI provenance (NOT agent runtime)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser, jsx-ast, benchmark, quality-audit, agent-compatibility, gate-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download actual evidence from this run
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: reports/collected
          merge-multiple: false
      - name: Build explicit non-runtime evidence manifest
        run: |
          python scripts/ci_provenance.py reports/collected --out reports/ci-provenance-manifest.json
          python -c 'import json; d=json.load(open("reports/ci-provenance-manifest.json")); assert not d["real_agent_runtime"] and not d["independent_validation"]'
      - name: Attest exact manifest via GitHub OIDC / Sigstore
        uses: actions/attest@v4
        with:
          subject-path: reports/ci-provenance-manifest.json
      - name: Independently verify GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify reports/ci-provenance-manifest.json \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/ci.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main
      - name: Publish signed CI manifest without pretending to run agents
        uses: actions/upload-artifact@v4
        with:
          name: signed-ci-evidence-manifest
          path: reports/ci-provenance-manifest.json
          retention-days: 90
