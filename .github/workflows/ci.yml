name: Skill integrity and regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install Pillow
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check manifest hashes
        run: python scripts/verify_manifest.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Browser fixture E2E
        run: python -m unittest discover -s tests -p 'test_*e2e.py' -v

  jsx-ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-save --no-package-lock typescript@5.9.3
      - name: JSX AST regression
        run: python -m unittest discover -s tests -p test_regressions_v2.py -v

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TypeScript parser
        run: npm install --no-save --no-package-lock typescript@5.9.3
      - name: Benchmark detector regression tests
        run: ANTI_AI_SLOP_RUN_AST_BENCHMARK=1 python -m unittest discover -s tests -p test_benchmark_v2.py -v
      - name: Five-stack development and holdout benchmark
        run: python scripts/run_benchmark.py --min-precision 0.90 --min-recall 0.85 --out reports/benchmark-stacks.json
      - name: Five product scenario benchmark
        run: python scripts/run_scenario_benchmark.py --out reports/benchmark-scenarios.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark-reports
          path: reports/benchmark-*.json

  quality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright Pillow
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Structural, axe-core, visual and Lighthouse integration
        run: python -m unittest tests.test_structural_fix tests.test_visual_compare tests.test_visual_e2e tests.test_quality_tools tests.test_lighthouse_e2e -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-audit-results
          path: reports/
          if-no-files-found: ignore

  agent-compatibility:
    name: Agent Skill compatibility (${{ matrix.agent }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, claude, cursor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate installed skills without authenticated agent execution
        run: python scripts/agent_compat.py --agent "${{ matrix.agent }}" --out "reports/agent-${{ matrix.agent }}.json"
      - name: Summarize and flag unverified runtime
        if: always()
        run: |
          python scripts/ci_summary.py "reports/agent-${{ matrix.agent }}.json" --out "reports/agent-${{ matrix.agent }}-summary.md"
          cat "reports/agent-${{ matrix.agent }}-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-compat-${{ matrix.agent }}
          path: reports/agent-${{ matrix.agent }}*.json
          if-no-files-found: error
          retention-days: 30

  gate-contract:
    name: Evidence gate negative tests and signed outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gate contract regression tests and preserve logs
        run: python scripts/ci_evidence.py --kind gate_contract --out reports/gate -- python -m unittest tests.test_gate tests.test_gate_hardening tests.test_ci_evidence -v
      - name: Gate MUST reject unproved 9.5 claims
        run: |
          if python scripts/evaluate_gate.py templates/GATE_INPUT.example.json --out reports/gate/unapproved-example.json; then
            echo "ERROR: gate approved an unverified claim" >&2
            exit 1
          fi
          echo 'Gate correctly rejected an unverified claim' > reports/gate/negative-gate.txt
      - name: Add truthful CI summary
        if: always()
        run: |
          python scripts/ci_summary.py reports/gate/gate_contract.json --out reports/gate/SUMMARY.md
          cat reports/gate/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish negative tests, logs and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-contract-evidence
          path: reports/gate/
          if-no-files-found: error
          retention-days: 30
