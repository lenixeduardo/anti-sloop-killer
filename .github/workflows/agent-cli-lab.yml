name: Install and verify three official coding CLIs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/agent-cli-lab.yml'
      - 'scripts/setup_agent_clis.sh'
      - 'scripts/probe_agent_clis.sh'
permissions:
  contents: read
jobs:
  agent-cli-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENT_LAB_ROOT: ${{ runner.temp }}/anti-sloop-agent-cli-lab
      CI: 'true'
    steps:
      - name: Checkout skill
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official CLI programs in isolated HOME
        id: installers
        continue-on-error: true
        shell: bash
        run: bash scripts/setup_agent_clis.sh
      - name: Verify CLI versions, skill installation and scanners
        id: validation
        if: always()
        continue-on-error: true
        shell: bash
        run: bash scripts/probe_agent_clis.sh
      - name: Publish non-secret installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-cli-install-lab
          path: |
            ${{ runner.temp }}/anti-sloop-agent-cli-lab/reports/
            ${{ runner.temp }}/anti-sloop-agent-cli-lab/setup-info.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce installation pass
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.installers.outcome }}
          VERIFY_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          echo "Official CLI installation outcome: $INSTALL_OUTCOME"
          echo "Version and skill verification outcome: $VERIFY_OUTCOME"
          test "$INSTALL_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
